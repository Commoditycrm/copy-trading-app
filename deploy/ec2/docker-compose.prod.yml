# Prod data/proxy tier for the EC2 host. Replaces the untracked
# docker-compose.override.yml on Lightsail; secrets come from the root .env
# (git-ignored) via interpolation instead of being inlined here.
#
#   COMPOSE_FILE=docker-compose.yml:deploy/ec2/docker-compose.prod.yml[:deploy/ec2/docker-compose.staging.yml]
#
# Relative paths resolve against the project dir (repo root), hence ./deploy/ec2/...

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: trading_app
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    # no host port; reachable only as db:5432 on the compose network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_app"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2g          # was unlimited; observed peak 323 MiB

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # sh -c keeps the password out of the compose file and the container Cmd
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  backend:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/ec2/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  pgdata:
  caddy_data:
  caddy_config:
